<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmar identidade – Google</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="brand-bar">
        <span class="google-logo" aria-hidden="true">
          <svg viewBox="0 0 18 18" focusable="false">
            <path
              fill="#EA4335"
              d="M9 3.48c1.69 0 2.84.73 3.49 1.34l2.56-2.49C13.54.97 11.48 0 9 0 5.48 0 2.44 1.99.96 4.9l2.98 2.32C4.63 5.02 6.63 3.48 9 3.48z"
            />
            <path
              fill="#4285F4"
              d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.93c-.1.83-.64 2.08-1.84 2.92l2.83 2.18c1.69-1.57 2.72-3.88 2.72-6.6z"
            />
            <path
              fill="#FBBC05"
              d="M3.92 10.45A5.42 5.42 0 0 1 3.6 9c0-.51.09-1.01.31-1.45L.93 5.21A8.972 8.972 0 0 0 0 9c0 1.42.34 2.78.93 3.99l2.99-2.54z"
            />
            <path
              fill="#34A853"
              d="M9 18c2.43 0 4.47-.8 5.96-2.19l-2.83-2.18c-.76.51-1.79.87-3.13.87-2.38 0-4.39-1.54-5.11-3.67L.96 12.99C2.44 15.99 5.48 18 9 18z"
            />
          </svg>
        </span>
        <span class="brand-text">Fazer Login com o Google</span>
      </header>

      <main class="card" role="main">
        <section class="card-left" aria-label="Informações da conta">
          <div class="app-avatar" aria-hidden="true">
            <svg viewBox="0 0 64 64" focusable="false">
              <rect
                x="8"
                y="8"
                width="48"
                height="48"
                rx="8"
                fill="#1C1C1C"
              />
              <path
                d="M32 12 16 24l16 12 16-12-16-12Zm0 38 16-12-4.8-3.6L32 42l-11.2-8.6L16 38l16 12Z"
                fill="#F3BA2F"
              />
              <path
                d="m32 22.2 8 6-8 6-8-6 8-6Z"
                fill="#F3BA2F"
              />
            </svg>
          </div>
          <h1 class="greeting">Olá!</h1>
          <div class="account-chip" aria-label="Conta selecionada">
            <span class="account-avatar" aria-hidden="true">
              <svg viewBox="0 0 32 32" focusable="false">
                <circle cx="16" cy="12" r="6" fill="#fff" opacity="0.24" />
                <path
                  d="M16 18c-5 0-9 2.9-9 6.5V26h18v-1.5C25 20.9 21 18 16 18z"
                  fill="#fff"
                  opacity="0.24"
                />
                <circle cx="16" cy="12" r="5" fill="none" stroke="#fff" stroke-width="2" />
              </svg>
            </span>
            <span class="account-email">davidxavierbrito@gmail.com</span>
          </div>
        </section>

        <section class="card-right" aria-label="Confirmação de identidade">
          <p class="instructions">
            Para continuar, primeiro confirme sua identidade
          </p>

          <label class="input-group" for="password">
            <span class="input-label">Digite sua senha</span>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder=""
              aria-required="true"
            />
          </label>

          <div class="checkbox-container">
            <input type="checkbox" id="show-password" />
            <label for="show-password">Mostrar senha</label>
          </div>

          <p class="disclaimer">
            Consulte a <a href="#">Política de Privacidade</a> e os
            <a href="#">Termos de Serviço</a> do app binance.com antes de usá-lo.
          </p>

          <div class="actions">
            <button class="text-button" type="button">Tentar de outro jeito</button>
            <button class="primary-button" type="submit">Avançar</button>
          </div>
        </section>
      </main>

      <footer class="page-footer">
        <button class="language-picker" type="button">
          Português (Brasil)
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <nav aria-label="Links do rodapé">
          <a href="#">Ajuda</a>
          <a href="#">Privacidade</a>
          <a href="#">Termos</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
