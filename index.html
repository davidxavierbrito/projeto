<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Google - Binance</title>
  <style>
    :root {
      color-scheme: dark;
      --background-main: #111315;
      --card-background: #1b1d1f;
      --surface-elevated: #202327;
      --text-primary: #e8eaed;
      --text-secondary: #b0b8c1;
      --accent-blue: #8ab4f8;
      --border-color: #3c4043;
      --input-background: #15171a;
      --brand-yellow: #f3ba2f;
      font-family: "Google Sans", "Roboto", "Arial", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top left, #1d2127 0%, #111315 45%, #0c0d0f 100%);
      color: var(--text-primary);
    }

    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 48px;
    }

    .login-card {
      width: min(920px, 100%);
      background: var(--card-background);
      border-radius: 24px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 24px 32px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 18px;
      letter-spacing: 0.01em;
    }

    .google-mark {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .google-mark svg {
      width: 100%;
      height: 100%;
    }

    .card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      padding: 48px 48px 40px;
    }

    .brand-panel {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(243, 186, 47, 0.12);
      border-radius: 16px;
    }

    .brand-logo svg {
      width: 36px;
      height: 36px;
      fill: var(--brand-yellow);
    }

    .brand-title {
      font-size: 48px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.01em;
    }

    .user-account {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding: 10px 16px;
      max-width: 360px;
    }

    .user-account svg {
      width: 22px;
      height: 22px;
      fill: var(--accent-blue);
      flex-shrink: 0;
    }

    .user-account span {
      font-size: 15px;
      color: var(--text-primary);
      word-break: break-all;
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .form-panel p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="password"] {
      background: var(--input-background);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 16px;
      color: var(--text-primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.2);
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-blue);
    }

    .policy-note {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .policy-note a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
    }

    .link-button {
      color: var(--accent-blue);
      background: none;
      border: none;
      font: inherit;
      padding: 0;
      cursor: pointer;
      text-decoration: none;
    }

    .primary-button {
      border: none;
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      color: #111;
      background: var(--accent-blue);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .primary-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(138, 180, 248, 0.35);
    }

    .primary-button:focus-visible {
      outline: 3px solid rgba(138, 180, 248, 0.55);
      outline-offset: 3px;
    }

    .page-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px 24px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .language-switcher {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .language-switcher select {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 8px 20px 8px 12px;
      color: var(--text-secondary);
      font-size: 13px;
      appearance: none;
      min-width: 150px;
    }

    .footer-links {
      display: flex;
      gap: 28px;
    }

    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--accent-blue);
    }

    @media (max-width: 860px) {
      .card-body {
        grid-template-columns: 1fr;
        gap: 40px;
        padding: 40px 32px 32px;
      }

      .brand-panel {
        flex-direction: row;
        align-items: center;
        gap: 24px;
      }

      .brand-panel > div,
      .brand-panel > h1 {
        margin: 0;
      }

      .brand-title {
        font-size: 40px;
      }

      .page-footer {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }
    }

    @media (max-width: 520px) {
      .login-card {
        border-radius: 0;
      }

      .card-header {
        padding: 20px 20px 18px;
        font-size: 16px;
      }

      .card-body {
        padding: 28px 22px 24px;
        gap: 32px;
      }

      .brand-panel {
        flex-direction: column;
        align-items: flex-start;
      }

      .brand-title {
        font-size: 34px;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .primary-button {
        width: 100%;
      }

      .language-switcher select {
        width: 100%;
      }

      .footer-links {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="login-card" aria-labelledby="login-heading">
      <header class="card-header">
        <span class="google-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img">
            <path fill="#4285f4" d="M44.5 20H24v8.5h11.9C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.5 29.6 2 24 2 12.4 2 3 11.4 3 23s9.4 21 21 21 21-9.4 21-21c0-1.1-.1-2.1-.5-3z"/>
            <path fill="#34a853" d="M6.3 14.7l6.9 5c1.9-3.7 5.7-6.2 9.8-6.2 3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.5 29.6 2 24 2c-7.4 0-13.9 4.1-17.7 10.1z"/>
            <path fill="#fbbc05" d="M24 44c5.9 0 10.9-1.9 14.6-5.1l-6.7-5.6c-2 1.3-4.6 2.1-7.9 2.1-6 0-11.2-4-13-9.4l-7 5.4C7.8 38.9 15.2 44 24 44z"/>
            <path fill="#ea4335" d="M44.5 20H24v8.5h11.9c-.9 2.7-2.6 5-4.9 6.5l6.7 5.6c3.9-3.6 6.3-8.9 6.3-15.1 0-1.1-.1-2.1-.5-3z"/>
          </svg>
        </span>
        <span id="login-heading">Fazer Login com o Google</span>
      </header>

      <div class="card-body">
        <div class="brand-panel">
          <div class="brand-logo" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Logotipo da Binance">
              <path d="M60 13.3 85.6 39 73.7 50.9 60 37.3 46.3 51 34.4 39 60 13.3zm46.7 46.7L120 73.3 94.4 99 82.5 87.1 96.2 73.4 82.6 59.8 94.5 47.9l12.2 12.1zM60 82.7 73.7 96.4 85.6 84.5 60 59 34.4 84.6 46.3 96.5 60 82.7zm-22.5-36 13.6 13.7-13.7 13.6L13.3 60l24.2-24.2 11.9 11.9-13.6 13.6zM60 47.1 72.9 60 60 72.9 47.1 60 60 47.1z"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Olá!</h1>
            <div class="user-account">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-hidden="true">
                <path d="M12 2a5.5 5.5 0 0 0-1 10.9V14H7a5 5 0 0 0-5 5v1h20v-1a5 5 0 0 0-5-5h-4v-1.1A5.5 5.5 0 0 0 12 2zM4 18a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3H4zm8-6.5A3.5 3.5 0 1 1 12 4a3.5 3.5 0 0 1 0 7.5z"/>
              </svg>
              <span>davidxavierbrito@gmail.com</span>
            </div>
          </div>
        </div>

        <form class="form-panel" action="#" method="post">
          <p>Para continuar, primeiro confirme sua identidade</p>
          <div class="input-group">
            <label for="password-input">Digite sua senha</label>
            <input id="password-input" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password">
            <label class="checkbox-line">
              <input type="checkbox" name="show-password">
              <span>Mostrar senha</span>
            </label>
          </div>
          <p class="policy-note">
            Consulte a <a href="#">Política de Privacidade</a> e os <a href="#">Termos de Serviço</a> do app binance.com antes de usá-lo.
          </p>
          <div class="actions">
            <a class="link-button" href="#">Tentar de outro jeito</a>
            <button type="submit" class="primary-button">Avançar</button>
          </div>
        </form>
      </div>
    </section>
  </div>

  <footer class="page-footer" aria-label="Rodapé">
    <div class="language-switcher">
      <label for="language" class="sr-only">Idioma</label>
      <select id="language" name="language" aria-label="Selecionar idioma">
        <option>Português (Brasil)</option>
        <option>English (US)</option>
        <option>Español</option>
        <option>Français</option>
      </select>
    </div>
    <nav class="footer-links" aria-label="Links do rodapé">
      <a href="#">Ajuda</a>
      <a href="#">Privacidade</a>
      <a href="#">Termos</a>
    </nav>
  </footer>

  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</body>
</html>
